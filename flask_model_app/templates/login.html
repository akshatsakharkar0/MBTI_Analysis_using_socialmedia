<!DOCTYPE html>
<html>
<head>
    <title>Login - MBTI Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='quiz.css') }}">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h1>🔐 Sign In</h1>
            <p>Access your personalized MBTI journey</p>
            
            <form id="login-form" class="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
            
            <div class="login-footer">
                <p>Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
                <a href="/" class="btn btn-secondary">Back to Home</a>
            </div>
        </div>
        
        <div id="signup-container" class="login-container" style="display:none;">
            <h1>📝 Sign Up</h1>
            <p>Create your MBTI analysis account</p>
            
            <form id="signup-form" class="login-form">
                <input type="text" id="signup-username" placeholder="Username" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
            
            <div class="login-footer">
                <p>Already have an account? <a href="#" onclick="showLogin()">Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        function showSignup() {
            document.querySelector('.login-container').style.display = 'none';
            document.getElementById('signup-container').style.display = 'block';
        }
        
        function showLogin() {
            document.querySelector('.login-container').style.display = 'block';
            document.getElementById('signup-container').style.display = 'none';
        }
        
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('username', username);
                    window.location.href = '/';
                } else {
                    alert(data.error || 'Login failed');
                }
            })
            .catch(err => {
                alert('Login error: ' + err);
            });
        });
        
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('signup-username').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            
            fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Account created successfully! Please sign in.');
                    showLogin();
                } else {
                    alert(data.error || 'Signup failed');
                }
            })
            .catch(err => {
                alert('Signup error: ' + err);
            });
        });
    </script>
</body>
</html>
